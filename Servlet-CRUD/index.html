
<html>
<head>
    <title>Student Management</title>
</head>
<body>

<h1>Student Management System</h1>

<h2>Add Student</h2>
<form action="hello" method="post">
    <input type="hidden" name="action" value="add">
    Register Number: <input type="text" name="regno" required><br><br>
    Name: <input type="text" name="name" required><br><br>
    Course: <input type="text" name="course" required><br><br>
    <button type="submit">Add</button>
</form>

<hr>

<h2>View All Students</h2>
<form action="hello" method="post">
    <input type="hidden" name="action" value="view">
    <button type="submit">View All</button>
</form>

<hr>

<h2>Search Student</h2>
<form action="hello" method="post">
    <input type="hidden" name="action" value="search">
    Register Number: <input type="text" name="regno" required>
    <button type="submit">Search</button>
</form>

<hr>

<h2>Update Student</h2>
<form action="hello" method="post">
    <input type="hidden" name="action" value="update">
    Register Number: <input type="text" name="regno" required><br><br>
    New Name: <input type="text" name="name" required><br><br>
    New Course: <input type="text" name="course" required><br><br>
    <button type="submit">Update</button>
</form>

<hr>

<h2>Delete Student</h2>
<form action="hello" method="post">
    <input type="hidden" name="action" value="delete">
    Register Number: <input type="text" name="regno" required>
    <button type="submit">Delete</button>
</form>

</body>
</html>
